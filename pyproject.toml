[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gomaxwebcam"
version = "2.0.0-dev"
description = "Cross-platform open source webcam utility for GoPro cameras"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "GoMaxWebcam Contributors"},
]
keywords = ["gopro", "webcam", "virtual-camera", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "open-gopro>=0.20.0",
    "bleak>=0.21.0",
    "av>=12.0.0",
    "pyvirtualcam>=0.11.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "keyring>=25.0.0",
    "platformdirs>=4.0.0",
    "tomli-w>=1.0.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.scripts]
gomaxwebcam = "gomaxwebcam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/v2"]
asyncio_mode = "auto"
markers = [
    "no_gopro_needed: tests that don't require physical GoPro hardware",
    "hardware: tests that require physical GoPro hardware",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
