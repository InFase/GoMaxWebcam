name: CI

on:
  push:
    branches: [v2-rewrite, main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: ruff check src/gomaxwebcam/

      - name: Run tests (mocked, no hardware)
        run: |
          pytest tests/v2/ -m "not hardware" -v --tb=short --co -q 2>/dev/null || true
          pytest tests/v2/ -m "not hardware" -v --tb=short

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: GoMaxWebcam-windows.exe
          - os: macos-latest
            artifact: GoMaxWebcam-macos
          - os: ubuntu-latest
            artifact: GoMaxWebcam-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller gomaxwebcam.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GoMaxWebcam*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GoMaxWebcam-windows.exe/*
            GoMaxWebcam-macos/*
            GoMaxWebcam-linux/*
          generate_release_notes: true
